<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>PreCheck</title>
  <link rel="stylesheet" href="/PreCheck/style.css" />
</head>
<body>
  <main class="wrap">
    <h1>PreCheck</h1>
    <div class="meta">
      <span id="updatedAt">불러오는 중…</span>
      <button id="refreshBtn" type="button">새로고침</button>
    </div>

    <table class="tbl" id="tbl">
      <thead>
        <tr>
          <th>완료</th>
          <th>순번</th>
          <th>제품명</th>
          <th>설명</th>
          <th>아티클넘버</th>
          <th>로케이션</th>
          <th>수량</th>
          <th>날짜</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>

    <p class="hint">
      ※ 체크 상태는 공용으로 저장됩니다. (새로고침/재접속 시 반영)
    </p>
  </main>

  <script src="/PreCheck/app.js"></script>
</body>
</html>
